# yamllint disable rule:line-length
#
# The long line is the Ignition data URL carrying the base64 of the script
# reproduced in full below. Ignition requires file contents as a single data
# URL, so it cannot be wrapped; the plaintext under it is what a reviewer
# should read instead.
#
# Give every node a cloud provider ID, so a cloud controller manager can
# identify it.
#
# This is half of what `platform: external` needs before a node can go Ready;
# the other half is the CCM itself, in 99_external-02-ccm-aws.yaml. Neither is
# supplied by the installer: cloudControllerManager.state: External is a
# declaration that the partner supplies both.
#
# A MachineConfig works here -- rather than needing a running Machine Config
# Operator -- because the bootstrap machine-config server renders everything in
# the openshift manifest directory into the config it serves at
# api-int:22623/config/master. Control-plane machines fetch that on first boot,
# so the unit below runs before their kubelet ever registers.
#
# The same pattern is used by the platform-external CI job
# (release/ci-operator/step-registry/platform-external/pre/conf/manifests) and
# by Oracle for OCI (oci-openshift/custom_manifests/manifests/02-machineconfig-ccm.yml),
# which is the strongest evidence available that it is the cross-provider
# answer rather than an AWS workaround.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 00-master-kubelet-providerid
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - path: /usr/local/bin/kubelet-providerid
        mode: 493
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
      - name: kubelet-providerid.service
        enabled: true
        contents: |
          [Unit]
          Description=Fetch the kubelet provider id from the instance metadata service
          # The kubelet reads /etc/kubernetes/kubelet-env at start, so this has to have
          # finished before it does -- there is no second chance once the Node is
          # registered without a providerID.
          After=NetworkManager-wait-online.service
          Before=kubelet.service
          [Service]
          ExecStart=/usr/local/bin/kubelet-providerid
          Type=oneshot
          RemainAfterExit=yes
          StandardOutput=journal+console
          StandardError=journal+console
          [Install]
          WantedBy=network-online.target
