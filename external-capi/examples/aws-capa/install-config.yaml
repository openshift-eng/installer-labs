apiVersion: v1
metadata:
  name: CHANGE-ME
baseDomain: splat.devcluster.openshift.com
platform:
  external:
    platformName: aws
    cloudControllerManager: External
    clusterAPI:
      name: aws
      binaryPath: /tmp/capa-artifacts/cluster-api-provider-aws
      componentsPath: /tmp/capa-artifacts/aws-infrastructure-components.yaml
      # hooks are user-supplied programs the installer runs at three points.
      # Each is a program plus the arguments the installer passes to it
      # verbatim; program paths are relative to the external-install
      # directory and must stay inside it.
      #
      # infraReady creates the cluster's api/api-int DNS, which nothing else
      # on this platform does; without it the install reaches the end of the
      # bootstrap timeout and fails at bootkube stage "resolve-api-int-url".
      #
      # postProvision creates the *.apps wildcard. It cannot be done at
      # infraReady: the address it points at belongs to a load balancer the
      # cluster's own cloud controller manager builds in response to
      # extra-manifests/99_external-03-ingress-nlb.yaml, minutes into
      # bootstrap, so it does not exist yet when infraReady runs. Its two
      # inputs are the Service to watch and the public hosted zone to publish
      # into, and both are arguments rather than installer knowledge --
      # the installer does not read them.
      #
      # preDestroy removes all of it again -- those records, and the load
      # balancer the CCM built, are outside Cluster API ownership, so the
      # Cluster delete will not touch them.
      hooks:
        infraReady:
          program: hooks/infra-hook.sh
        postProvision:
          program: hooks/infra-hook.sh
          args:
          - --input-service=openshift-ingress/router-external-default
          - --input-dns-zone=Z0051722292W4A5UBGRIT
        preDestroy:
          program: hooks/infra-hook.sh
      # args are appended to the arguments the installer supplies
      # (pkg/clusterapi/external.go:153-159), which are only the four every
      # provider is assumed to accept. Anything provider-specific comes from
      # here.
      #
      # This list is copied verbatim from what the INTEGRATED aws path passes
      # at pkg/clusterapi/system.go:199. BootstrapFormatIgnition is not
      # optional for this pilot: without it CAPA's validating webhook rejects
      # the AWSCluster outright --
      #   spec.s3Bucket: Forbidden: can be set only if the
      #   BootstrapFormatIgnition feature gate is enabled
      # -- and the same gate is what makes AWSMachine.spec.ignition legal.
      args:
      - --feature-gates=BootstrapFormatIgnition=true,ExternalResourceGC=true,TagUnmanagedNetworkResources=false,EKS=false,MachinePool=false
controlPlane:
  name: master
  replicas: 3
compute:
- name: worker
  replicas: 0
pullSecret: ""
sshKey: ""
