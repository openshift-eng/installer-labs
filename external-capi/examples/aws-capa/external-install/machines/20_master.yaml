  ami:
    id: ami-REPLACE
  instanceType: m6i.xlarge
  publicIP: false
  ignition:
    version: "3.2"
    storageType: UnencryptedUserData
  instanceMetadataOptions:
    httpEndpoint: enabled
    httpTokens: optional
  rootVolume:
    encrypted: true
    size: 120
    type: gp3
  sshKeyName: ""
  subnet:
    filters:
    - name: tag:Name
      values:
      - CLUSTER_ID-subnet-private-us-east-1a
---
