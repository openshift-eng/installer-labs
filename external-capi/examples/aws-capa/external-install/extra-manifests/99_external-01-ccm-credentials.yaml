# Cloud credentials for the AWS cloud controller manager.
#
# THIS IS A TEMPLATE. The value below is empty on purpose and is filled in on
# the per-run copy of the install directory by inject-ccm-credentials.sh, which
# writes the file without printing it. Never paste a real credential here: this
# directory is read by agents and committed to git.
#
#
# WHY A SECRET AND NOT AN INSTANCE PROFILE
#
# The integrated AWS path gives the control-plane machines an IAM instance
# profile (<infraID>-master-profile) and the CCM picks up credentials from the
# instance metadata service. This pilot deliberately creates no IAM at all, so
# the masters run with no instance profile -- confirmed on mrb-ext11, where
# every master reports IamInstanceProfile: NONE -- and the CCM would have no
# way to call EC2.
#
# A Secret is not a workaround for that; it is the more representative case.
# `platform: external` means the installer knows nothing about the partner's
# cloud, so it cannot create that cloud's identities. Oracle reaches the same
# conclusion for OCI, where the CCM is configured by a Secret the user fills in
# (oci-openshift/docs/STORAGE.md:85). A partner running this for real would
# more likely use an instance profile, and can: the CCM Deployment falls back
# to the metadata service when this Secret is absent.
#
# The key name and format are the ones the integrated path already uses -- an
# AWS shared credentials file under the key `credentials` -- so the Deployment
# needs nothing AWS-specific beyond AWS_SHARED_CREDENTIALS_FILE.
#
#   [default]
#   aws_access_key_id = ...
#   aws_secret_access_key = ...
#
apiVersion: v1
kind: Secret
metadata:
  name: aws-cloud-credentials
  namespace: openshift-cloud-controller-manager
type: Opaque
data:
  credentials: ""
