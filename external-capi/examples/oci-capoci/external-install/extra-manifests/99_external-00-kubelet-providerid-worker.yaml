# yamllint disable rule:line-length
#
# The long line is the Ignition data URL carrying the base64 of the script
# reproduced in full below. Ignition requires file contents as a single data
# URL, so it cannot be wrapped; the plaintext under it is what a reviewer
# should read instead.
#
# Give every node a cloud provider ID, so the OCI cloud controller manager can
# identify it.
#
# Adapted from Oracle's own
# oci-openshift/custom_manifests/butane/oci-kubelet-providerid-worker.bu, which
# IS in production use -- but there it is applied by Agent-based installation,
# not by this path, and the script below is hardened relative to Oracle's. See
# README.md.
#
# STATUS: rendered, not yet confirmed applied. The master variant of this
# manifest demonstrably ran on the 2026-10-01 run; the worker machines of that
# run launched but never fetched their config, so this file has been served by
# the machine-config server and not yet observed taking effect. Stated this way
# deliberately -- "the master one worked" is not evidence about this one.
#
# This is half of what `platform: external` needs before a node can go Ready;
# the other half is the CCM itself, and on OCI the CCM's CONFIG cannot be a
# day-0 manifest at all. Read README.md before adding one.
#
# A MachineConfig works here -- rather than needing a running Machine Config
# Operator -- because the bootstrap machine-config server renders everything in
# the openshift manifest directory into the config it serves at
# api-int:22623/config/worker. Machines fetch that on first boot, so the unit
# below runs before their kubelet ever registers.
#
# CORRECTION, AFTER A RUN. This block used to say that Oracle's
# oci-hostname-update.service was "left out deliberately to keep this example
# to one concern", and that the consequence was merely that "some CCM lookups
# that fall back to name matching will not find the instance". Both halves were
# wrong, and the superseded text is quoted here rather than deleted.
#
# MEASURED on the masters of the 2026-10-01 run: with no hostname unit, a
# machine registers as "localhost.localdomain" --
#
#     NAME                    STATUS     ROLES                  AGE   VERSION
#     localhost.localdomain   NotReady   control-plane,master   88s   v1.36.3
#
# -- so every node of a role contends for ONE Node object. On the control plane
# that means the cluster never forms. A worker hits the same collision; it was
# not observed there only because those machines never got far enough.
#
# The fix is a separate manifest, 99_external-01-oci-hostname-{master,worker}
# .yaml, hardened relative to Oracle's unit in three ways it documents inline.
# It is separate for the same "one concern" reason given above -- that part of
# the judgement still holds. What did not hold is treating the concern as
# optional.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 00-worker-oci-kubelet-providerid
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - path: /usr/local/bin/oci-kubelet-providerid
        mode: 493
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
      - name: oci-kubelet-providerid.service
        enabled: true
        contents: |
          [Unit]
          Description=Fetch the kubelet provider id from the OCI instance metadata service
          # The kubelet reads its drop-in directory at start, so this has to have
          # finished before it does -- there is no second chance once the Node is
          # registered without a providerID.
          After=NetworkManager-wait-online.service
          Before=kubelet.service
          [Service]
          ExecStart=/usr/local/bin/oci-kubelet-providerid
          Type=oneshot
          RemainAfterExit=yes
          StandardOutput=journal+console
          StandardError=journal+console
          [Install]
          WantedBy=network-online.target
