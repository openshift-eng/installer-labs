# External load balancer for the ingress routers on `platform: external`, OCI.
#
# The cluster has no way to get one otherwise, and the reason is not specific to
# OCI. On `platform: external` the ingress operator selects
# endpointPublishingStrategy.type: HostNetwork, so the routers bind 80 and 443
# on the nodes themselves and the only Service the operator creates is
# router-internal-default, a ClusterIP. Nothing asks for an external address, so
# nothing creates one, `*.apps` resolves to nothing, and `authentication` and
# `console` stay unavailable while every other operator goes green. Measured on
# run 13 (2026-10-01): 29 of 34 operators Available, the two missing ones both
# blocked on ingress.
#
# CAPOCI cannot supply this either. An OCICluster has exactly one load balancer,
# the API server's, and no concept of a second. So the cluster asks for its own,
# through the same cloud controller manager the partner already had to supply --
# the most native path available, and the direct analogue of the aws-capa
# sibling's 99_external-03-ingress-nlb.yaml.
#
#
# WHAT THIS FILE DOES NOT CARRY, AND WHY IT CANNOT
#
# The network security group. An OCI load balancer is reachable only if
# something permits 80 and 443 to it, and on a CAPOCI network that something has
# to be an NSG: CAPOCI puts the service-lb subnet on the VCN's DEFAULT security
# list, whose ingress is SSH and ICMP only, and there is no per-subnet list to
# point `securityListManagementMode: Frontend` at. CAPOCI does build a
# correctly-ruled service-lb NSG -- 80 and 443 from 0.0.0.0/0 -- but the CCM
# attaches an NSG only when the Service names it BY OCID, and that OCID is
# generated by CAPOCI minutes after this file is written.
#
# So the annotation cannot be here, and the hook adds it at post-provision:
# annotate_ingress_nsg in ../hooks/infra-hook.sh. This is divergence 077's
# defect 1 -- placement expressible only by OCID -- recurring in a second
# controller, and it is the generic reason a day-0 manifest set is not
# sufficient on a non-integrated provider.
#
#
# THE PORTS, AND THE NSG RULE THAT IS NOT IN THIS FILE EITHER
#
#   internet :443
#     -> NLB listener 443              (from spec.ports[].port)
#     -> node :30289                   (nodePort, assigned by Kubernetes)
#     -> OVN load balancer
#     -> endpoint <NODE ip>:443        (a NODE address, because hostNetwork)
#     -> router
#
# The fourth hop is the one that bites. Because the endpoints are node
# addresses, OVN will balance a request arriving at node A to a router on node
# B -- which means node A opens a connection to node B's port 443. CAPOCI's
# control-plane and worker NSGs open 30000-32767 but NOT 80/443, so that hop was
# silently dropped and external ingress timed out with the load balancer
# healthy, the Service correct and the routers serving. The two rules that fix
# it are in ../cluster.yaml, on the control-plane and worker NSGs, sourced from
# the VCN CIDR only. Divergence 078 has the measurement.
#
#
# THE DNS RECORD IS NOT HERE EITHER
#
# The address is assigned at runtime. The post-provision hook publishes it:
#
#   hooks:
#     postProvision:
#       program: hooks/infra-hook.sh
#       args:
#         - --input-service=openshift-ingress/router-external-default
#
# The hook is told the namespace/name below and nothing else connects the two.
# If you rename this Service, change --input-service to match -- and note that
# the name also ends up in the load balancer's display name, which is the only
# handle the destroy path has on it.
#
# Teardown is the same hook's pre-destroy path. `destroy cluster` never deletes
# this Service, so the load balancer the CCM built for it would be orphaned.
apiVersion: v1
kind: Service
metadata:
  name: router-external-default
  namespace: openshift-ingress
  annotations:
    # A network load balancer, not the default LBaaS. This choice propagates:
    # every other annotation below is NLB-scoped, with a different prefix from
    # the LBaaS spelling, and the CCM silently ignores an annotation written
    # with the wrong prefix.
    oci.oraclecloud.com/load-balancer-type: nlb

    # The CCM must not manage security rules. There is no per-subnet security
    # list for it to manage -- see above -- and `Frontend` against the VCN
    # default list would have it editing a list shared with everything else in
    # the VCN. Reachability comes from the NSG the hook attaches instead.
    oci-network-load-balancer.oraclecloud.com/security-list-management-mode: None
spec:
  type: LoadBalancer
  # Preserve the client source IP, which the router needs for X-Forwarded-For,
  # and stop traffic being forwarded to nodes with no local router. This is what
  # OpenShift uses on the integrated platforms.
  #
  # Verified on run 13 rather than assumed: it was flipped to `Cluster` while
  # chasing the timeout above, changed nothing, and was flipped back. The
  # timeout was the missing NSG rule, not this field.
  externalTrafficPolicy: Local
  selector:
    ingresscontroller.operator.openshift.io/deployment-ingresscontroller: default
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
